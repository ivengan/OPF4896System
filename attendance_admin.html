<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2"/>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 p-6">
  <!-- Back to Admin Panel -->
  <div class="max-w-4xl mx-auto mb-4">
    <button onclick="window.location.href='dashboard2.html'" class="text-indigo-600 font-bold flex items-center gap-1 bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.25rem; height: 1.25rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Back to Admin Panel
    </button>
  </div>

  <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
    <h1 class="text-2xl font-bold mb-6">Admin Panel</h1>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 mb-8">
      <button onclick="goToApproveLeave()" class="relative bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded w-full">
        <span>Approve Leave</span>
        <span id="leaveNotificationBadge" class="hidden absolute top-0 right-0 -mt-2 -mr-2 w-5 h-5 bg-red-500 rounded-full flex items-center justify-center text-white text-xs font-bold">!</span>
      </button>
      <button onclick="openTimestampEditor()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded w-full">Edit Timestamps</button>
      <button onclick="triggerOvertimeTransition()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded w-full">Start OT</button>
      <button onclick="openReportGenerator()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded w-full">Generate Report</button>
      <button onclick="offWork()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded w-full">OFF WORK!</button>
    </div>
    <h2 class="text-xl font-semibold border-t pt-4 mb-4">Manage Staff</h2>
    <form id="staffForm" class="mb-6 flex flex-col sm:flex-row sm:items-end gap-2">
      <div class="flex-grow">
        <label for="name" class="block text-sm font-medium text-gray-700">Staff Name</label>
        <input type="text" id="name" placeholder="Staff Name" required class="mt-1 border px-3 py-2 rounded w-full" />
      </div>
      <div class="flex-grow">
        <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number</label>
        <input type="text" id="phone" placeholder="10/11 digits" class="mt-1 border px-3 py-2 rounded w-full" />
      </div>
      <div class="w-full sm:w-40">
        <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
        <select id="role" class="mt-1 border px-3 py-2 rounded w-full">
            <option value="staff" selected>Staff</option>
            <option value="driver">Lorry Driver</option>
        </select>
      </div>
      <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white px-6 py-2 rounded w-full sm:w-auto flex-shrink-0">Add Staff</button>
    </form>
    <div id="staffList" class="space-y-2"></div>
  </div>
  <div id="editTimestampModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center hidden z-50">
      <div class="bg-white p-6 rounded shadow-lg w-full max-w-md">
        <h2 class="text-xl font-bold mb-4">Edit Staff Timestamps</h2>
        <div class="space-y-4">
          <div><label for="staffSelect" class="block mb-1 font-semibold text-gray-700">Select Staff:</label><select id="staffSelect" class="w-full p-2 border rounded"></select></div>
          <div><label for="dateSelect" class="block mb-1 font-semibold text-gray-700">Select Date:</label><input type="date" id="dateSelect" class="w-full p-2 border rounded"/></div>
          <div><label for="newClockIn" class="block mb-1 font-semibold text-gray-700">Clock-In Time:</label><input type="datetime-local" id="newClockIn" class="w-full p-2 border rounded"/></div>
          <div><label for="newClockOut" class="block mb-1 font-semibold text-gray-700">Clock-Out Time (Optional):</label><input type="datetime-local" id="newClockOut" class="w-full p-2 border rounded"/></div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button onclick="closeTimestampEditor()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">Cancel</button>
          <button onclick="saveTimestampEdits()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">Save Changes</button>
        </div>
      </div>
  </div>

  <script src="firebase-init-attendance.js"></script>
  <script src="admin.js"></script>
  <script>
    (async function guard(){
        const loginExpiry = localStorage.getItem('loginExpiry');
        if (!loginExpiry || Date.now() >= parseInt(loginExpiry)) {
            localStorage.removeItem('loginExpiry');
            alert("Access denied. Please login first.");
            window.location.href = "index.html";
            return;
        }
        const userPhone = localStorage.getItem("user_phone");
        if (!userPhone) {
            alert("Access denied. Please login first.");
            window.location.href = "index.html";
            return;
        }
        try {
            // Master admin bypass
            if (userPhone === "0176405645") return;
            
            const snap = await db.collection("staffs").where("phone","==",userPhone).limit(1).get();
            if (snap.empty) {
                alert("Access denied. Admin account not found in attendance database.");
                window.location.href = "dashboard2.html";
                return;
            }
            const user = snap.docs[0].data();
            if (!user.admin) {
                alert("Access denied. Admins only.");
                window.location.href = "dashboard2.html";
                return;
            }
        } catch (e) {
            console.error(e);
            alert("Access check failed.");
            window.location.href = "dashboard2.html";
        }
    })();
  </script>
  <script src="main.js"></script>
</body>
</html>
