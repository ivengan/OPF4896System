<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Submit Order</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pwa-install.js" defer></script>
    <style>
        .hidden { display: none !important; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); }
        @keyframes popIn { 
            0% { transform: scale(0.9); opacity: 0; } 
            100% { transform: scale(1); opacity: 1; } 
        }
        .animate-pop { animation: popIn 0.2s ease-out forwards; }
        /* Clean and minimalist specific styling */
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 antialiased min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-xl relative z-0">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Client Portal</h1>
                <p class="text-gray-500 mt-2 text-sm font-medium">Please login to continue</p>
            </div>

            <div id="login-notification" class="hidden mb-4 p-3 rounded-lg text-center font-bold text-sm"></div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Phone Number</label>
                    <input type="tel" id="login-phone" placeholder="01xxxxxxxx" maxlength="12"
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition font-medium" autocomplete="tel">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Password</label>
                    <input type="password" id="login-password" placeholder="Your Phone Number" 
                        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" autocomplete="current-password">
                </div>
                
                <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:scale-95 transition shadow-lg mt-2">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- ORDER SCREEN -->
    <div id="order-screen" class="hidden min-h-screen pb-24">
        <header class="bg-white shadow-sm sticky top-0 z-10 safe-top glass">
            <div class="max-w-3xl mx-auto px-4">
                <div class="flex justify-between items-center py-4">
                    <div>
                        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Order Portal</h1>
                        <p id="header-today-date" class="text-xs font-semibold text-gray-500 uppercase tracking-widest mt-1"></p>
                    </div>
                    <button id="btn-logout" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs px-4 py-2 rounded-lg transition">Logout</button>
                </div>
            </div>
        </header>

        <main class="max-w-3xl mx-auto py-6 px-4 space-y-6">
            <div id="order-notification" class="hidden"></div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <h2 id="display-company-name" class="text-2xl font-bold text-gray-900 tracking-tight">Loading...</h2>
                <p class="text-gray-500 text-sm mt-1 font-medium">What would you like to order today?</p>
            </div>

            <!-- Date Selection -->
            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <label class="block font-bold text-gray-800 mb-2">Delivery Date</label>
                <input type="date" id="order-date" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-gray-700 transition focus:bg-white">
            </div>

            <!-- Main Categories -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="openCategoryModal('Broiler')" class="bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-2xl p-6 text-center transition shadow-sm group">
                    <div class="w-16 h-16 mx-auto bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg">Broiler</h3>
                </button>
                <button onclick="openCategoryModal('Slices')" class="bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-2xl p-6 text-center transition shadow-sm group">
                    <div class="w-16 h-16 mx-auto bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path></svg>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg">Slices</h3>
                </button>
                <button onclick="openCategoryModal('Chicken Parts')" class="bg-white hover:bg-blue-50 border border-gray-200 hover:border-blue-300 rounded-2xl p-6 text-center transition shadow-sm group">
                    <div class="w-16 h-16 mx-auto bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg">Chicken Parts</h3>
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                <label class="block font-bold text-gray-800 mb-2">General Order Remark</label>
                <textarea id="general-remark" rows="2" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition" placeholder="Any special instructions for the whole order..."></textarea>
            </div>
        </main>

        <!-- Floating View Cart Button -->
        <div class="fixed bottom-6 left-0 right-0 z-40 px-4 max-w-3xl mx-auto">
            <button onclick="openCartModal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] transition flex justify-between items-center px-6">
                <span class="flex items-center gap-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span class="text-lg">View Cart</span>
                </span>
                <span id="cart-count" class="bg-white text-blue-600 py-1 px-3 rounded-full text-sm font-black">0 items</span>
            </button>
        </div>
    </div>

    <!-- Category Modal -->
    <div id="modal-category" class="hidden fixed inset-0 z-50 modal-overlay flex flex-col justify-end sm:items-center sm:justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-lg animate-pop relative h-[85vh] sm:h-auto sm:max-h-[85vh] flex flex-col">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center shrink-0">
                <h2 id="category-title" class="text-2xl font-bold text-gray-900">Category</h2>
                <button onclick="closeModal('modal-category')" class="bg-gray-100 hover:bg-gray-200 rounded-full p-2 text-gray-500 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div id="product-list" class="p-4 overflow-y-auto flex-grow space-y-4 bg-gray-50">
                <!-- Products dynamically injected -->
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="modal-add-item" class="hidden fixed inset-0 z-[60] modal-overlay flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 animate-pop relative">
            <button onclick="closeModal('modal-add-item')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="mb-5 flex flex-col items-center text-center">
                <div id="add-item-img-container" class="w-24 h-24 bg-gray-100 rounded-2xl mb-4 flex items-center justify-center overflow-hidden border border-gray-100 shadow-sm">
                    <img id="add-item-img" src="" class="w-full h-full object-cover hidden">
                    <svg id="add-item-no-img" class="w-8 h-8 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg>
                </div>
                <h3 id="add-item-name" class="font-bold text-xl text-gray-900 leading-tight">Product Name</h3>
            </div>
            
            <form id="add-item-form" class="space-y-4">
                <input type="hidden" id="add-item-category">
                
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Quantity</label>
                    <input type="number" id="add-item-qty" required step="0.5" min="0.5" class="w-full border border-gray-300 bg-gray-50 rounded-xl p-3 text-center text-xl font-bold focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" placeholder="0">
                </div>
                
                <div id="unit-container" class="hidden">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Unit</label>
                    <select id="add-item-unit" class="w-full border border-gray-300 bg-gray-50 rounded-xl p-3 font-semibold focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                        <option value="KG">KG</option>
                        <option value="BAG">BAG</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Remark (Optional)</label>
                    <input type="text" id="add-item-remark" class="w-full border border-gray-300 bg-gray-50 rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none" placeholder="e.g. Potong 8, Size 1.8">
                </div>
                
                <div class="pt-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-md text-lg">
                        Add to Cart
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- View Cart Modal -->
    <div id="modal-cart" class="hidden fixed inset-0 z-50 modal-overlay flex flex-col justify-end sm:items-center sm:justify-center p-0 sm:p-4">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl w-full max-w-lg animate-pop relative h-[90vh] flex flex-col">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center shrink-0">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">View Cart</h2>
                    <p class="text-sm font-medium text-gray-500" id="cart-modal-count">0 items</p>
                </div>
                <button onclick="closeModal('modal-cart')" class="bg-gray-100 hover:bg-gray-200 rounded-full p-2 text-gray-500 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div id="cart-list" class="p-6 overflow-y-auto flex-grow space-y-4 bg-gray-50">
                <!-- Cart items dynamically injected -->
            </div>
            
            <div class="p-6 bg-white border-t border-gray-100 shrink-0">
                <button id="btn-submit-order" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl transition shadow-lg text-lg">
                    Submit Order
                </button>
            </div>
        </div>
    </div>

    <!-- PWA Guide -->
    <div id="pwa-guide" class="hidden fixed bottom-24 left-4 right-4 z-30 animate-pop max-w-md mx-auto">
        <div class="bg-gray-900 text-white p-4 rounded-2xl shadow-xl relative">
            <button onclick="document.getElementById('pwa-guide').classList.add('hidden')" class="absolute top-2 right-2 text-gray-400 hover:text-white p-1">&times;</button>
            <div class="flex items-center gap-3">
                <img src="icons/icon-192.png" alt="App" class="w-10 h-10 rounded-lg">
                <div>
                    <h4 class="font-bold text-sm">Install App</h4>
                    <p id="pwa-instructions" class="text-xs text-gray-300 mt-1"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBQAKliT1QN8H-FOuNzvUGArbyQfM_U5MA",
            authDomain: "opf4896system.firebaseapp.com",
            projectId: "opf4896system",
            storageBucket: "opf4896system.firebasestorage.app",
            messagingSenderId: "150864121707",
            appId: "1:150864121707:web:b3161a86514c1d86dd062e"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(err => console.log('Offline error:', err.code));

        // State
        let loggedInCustomerName = null;
        let loggedInCustomerId = null;
        let allSkus = [];
        let currentBroilers = [];
        let currentParts = [];
        let editingCartItem = null;

        const loginScreen = document.getElementById('login-screen');
        const orderScreen = document.getElementById('order-screen');

        // Setup Dates
        const today = new Date();
        today.setDate(today.getDate() + 1);
        const tomorrowStr = today.toISOString().split('T')[0];
        document.getElementById('order-date').value = tomorrowStr;
        document.getElementById('order-date').min = tomorrowStr;
        
        function updateHeaderDate() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('header-today-date').textContent = `${d}/${m}/${now.getFullYear()}`;
        }
        document.addEventListener('DOMContentLoaded', updateHeaderDate);

        function showNotify(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `mb-4 p-4 rounded-xl text-center font-bold text-sm ${type === 'error' ? 'bg-red-50 border border-red-100 text-red-700' : 'bg-green-50 border border-green-100 text-green-700'} animate-pop`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        function normalizePhone(nr) {
            let n = nr.replace(/\D/g, '');
            if (n.startsWith('60')) n = n.substring(1);
            if (n.startsWith('0')) return n;
            return '0' + n;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        window.addEventListener('DOMContentLoaded', () => {
            const storedId = localStorage.getItem('client_id');
            const storedName = localStorage.getItem('client_name');
            if (storedId && storedName) {
                loggedInCustomerId = storedId;
                loggedInCustomerName = storedName;
                initOrderScreen();
            }
            setupPWAInstructions();
        });

        function setupPWAInstructions() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            if (!isStandalone) {
                const text = document.getElementById('pwa-instructions');
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const isAndroid = /Android/.test(navigator.userAgent);
                if (isIOS) {
                    text.innerHTML = 'Tap Share then Add to Home Screen';
                    document.getElementById('pwa-guide').classList.remove('hidden');
                } else if (isAndroid) {
                    text.innerHTML = 'Tap Menu then Add to Home screen';
                    document.getElementById('pwa-guide').classList.remove('hidden');
                }
            }
        }

        async function initOrderScreen() {
            loginScreen.classList.add('hidden');
            orderScreen.classList.remove('hidden');
            
            const hasLoggedInBefore = localStorage.getItem('has_logged_in_before_id');
            let greeting = "Hello, ";
            if (hasLoggedInBefore === loggedInCustomerId) {
                greeting = "Welcome back, ";
            } else {
                localStorage.setItem('has_logged_in_before_id', loggedInCustomerId);
            }
            document.getElementById('display-company-name').textContent = greeting + loggedInCustomerName + "!";
            
            loadSkus();
            updateCartCount();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phoneInput = document.getElementById('login-phone').value.trim();
            const pwdInput = document.getElementById('login-password').value.trim();
            const btn = document.getElementById('btn-login');

            if (!phoneInput || !pwdInput) return showNotify('login-notification', 'Enter phone and password.', 'error');
            
            const normalized = normalizePhone(phoneInput);
            btn.textContent = "Verifying...";
            btn.disabled = true;

            try {
                const snapshot = await db.collection('customers').where('phone', 'in', [normalized, '6' + normalized]).limit(1).get();
                if (snapshot.empty) throw new Error("Phone number not registered.");

                const doc = snapshot.docs[0];
                const data = doc.data();

                if (pwdInput === data.phone) {
                    loggedInCustomerId = doc.id;
                    loggedInCustomerName = data.displayName;
                    localStorage.setItem('client_id', loggedInCustomerId);
                    localStorage.setItem('client_name', loggedInCustomerName);
                    initOrderScreen();
                } else {
                    throw new Error("Incorrect password. Password is your phone number.");
                }
            } catch(e) {
                showNotify('login-notification', e.message, 'error');
            } finally {
                btn.textContent = "Login";
                btn.disabled = false;
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('client_id');
            localStorage.removeItem('client_name');
            window.location.reload();
        });

        // Load SKUs
        function loadSkus() {
            db.collection('skus').onSnapshot(snap => {
                allSkus = [];
                snap.forEach(doc => allSkus.push({ id: doc.id, ...doc.data() }));
            });
        }

        window.openCategoryModal = (category) => {
            document.getElementById('category-title').textContent = category;
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            
            const filtered = allSkus.filter(s => s.category === category);
            
            if(filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-gray-400 font-medium">No products in this category.</div>';
            } else {
                filtered.forEach(p => {
                    const imgHtml = p.imageUrl ? `<img src="${p.imageUrl}" class="w-full h-full object-cover">` : `<div class="bg-gray-200 w-full h-full"></div>`;
                    list.innerHTML += `
                        <div onclick="openAddItemModal('${p.name}', '${p.category}', '${p.imageUrl || ''}')" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-4 cursor-pointer hover:border-blue-300 transition">
                            <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0 shadow-sm border border-gray-100">
                                ${imgHtml}
                            </div>
                            <div class="flex-grow">
                                <h4 class="font-bold text-gray-900 text-lg">${p.name}</h4>
                                <p class="text-blue-600 font-semibold text-sm mt-0.5">Tap to add</p>
                            </div>
                            <div class="text-gray-300 shrink-0">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    `;
                });
            }
            openModal('modal-category');
        };

        window.openAddItemModal = (name, category, imgUrl, editIndex = null, editType = null) => {
            editingCartItem = editIndex !== null ? { index: editIndex, type: editType } : null;
            
            document.getElementById('add-item-name').textContent = name;
            document.getElementById('add-item-category').value = category;
            
            const imgEl = document.getElementById('add-item-img');
            const noImgEl = document.getElementById('add-item-no-img');
            if (imgUrl) {
                imgEl.src = imgUrl;
                imgEl.classList.remove('hidden');
                noImgEl.classList.add('hidden');
            } else {
                imgEl.classList.add('hidden');
                noImgEl.classList.remove('hidden');
            }

            const unitContainer = document.getElementById('unit-container');
            if (category === 'Chicken Parts') {
                unitContainer.classList.remove('hidden');
            } else {
                unitContainer.classList.add('hidden');
            }

            // Reset or pre-fill form
            if (editingCartItem) {
                let item = editType === 'broiler' ? currentBroilers[editIndex] : currentParts[editIndex];
                document.getElementById('add-item-qty').value = item.qty;
                document.getElementById('add-item-remark').value = item.remark || '';
                if(editType === 'parts') document.getElementById('add-item-unit').value = item.unit;
            } else {
                document.getElementById('add-item-qty').value = '';
                document.getElementById('add-item-remark').value = '';
                document.getElementById('add-item-unit').value = 'KG';
            }

            // Close category modal if it's open, open add item modal
            closeModal('modal-category');
            openModal('modal-add-item');
        };

        document.getElementById('add-item-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('add-item-name').textContent;
            const category = document.getElementById('add-item-category').value;
            const qty = parseFloat(document.getElementById('add-item-qty').value);
            const remark = document.getElementById('add-item-remark').value.trim();
            const unit = document.getElementById('add-item-unit').value;

            if (category === 'Chicken Parts') {
                if (editingCartItem && editingCartItem.type === 'parts') {
                    currentParts[editingCartItem.index] = { name, qty, unit, remark };
                } else {
                    currentParts.push({ name, qty, unit, remark });
                }
            } else {
                // Broiler or Slices -> maps to description
                if (editingCartItem && editingCartItem.type === 'broiler') {
                    currentBroilers[editingCartItem.index] = { description: name, qty, remark };
                } else {
                    currentBroilers.push({ description: name, qty, remark });
                }
            }

            updateCartCount();
            closeModal('modal-add-item');
            showNotify('order-notification', `${name} added to cart.`, 'success');
            
            // If we were editing from the cart, re-render cart
            if (editingCartItem && !document.getElementById('modal-cart').classList.contains('hidden')) {
                renderCart();
            }
        });

        function updateCartCount() {
            const total = currentBroilers.length + currentParts.length;
            document.getElementById('cart-count').textContent = `${total} items`;
            document.getElementById('cart-modal-count').textContent = `${total} items`;
        }

        window.openCartModal = () => {
            renderCart();
            openModal('modal-cart');
        };

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            
            if (currentBroilers.length === 0 && currentParts.length === 0) {
                list.innerHTML = '<div class="text-center py-12 text-gray-400 font-medium">Your cart is empty.</div>';
                return;
            }

            const renderItem = (name, qtyStr, remark, index, type) => {
                // Find image if possible
                let p = allSkus.find(s => s.name === name);
                let imgHtml = p && p.imageUrl ? `<img src="${p.imageUrl}" class="w-full h-full object-cover">` : `<div class="bg-gray-200 w-full h-full"></div>`;
                let category = type === 'broiler' ? (name.includes('Slices') ? 'Slices' : 'Broiler') : 'Chicken Parts';
                
                return `
                    <div class="bg-white border border-gray-100 rounded-2xl p-4 flex items-center gap-4 shadow-sm relative overflow-hidden">
                        <div class="w-16 h-16 rounded-xl overflow-hidden shrink-0 border border-gray-100">
                            ${imgHtml}
                        </div>
                        <div class="flex-grow">
                            <h4 class="font-bold text-gray-900">${name}</h4>
                            <p class="text-blue-600 font-bold text-sm mt-0.5">${qtyStr}</p>
                            ${remark ? `<p class="text-gray-500 text-xs mt-1 bg-gray-50 p-1.5 rounded-lg inline-block border border-gray-100">${remark}</p>` : ''}
                        </div>
                        <div class="flex flex-col gap-2 shrink-0">
                            <button onclick="openAddItemModal('${name}', '${category}', '${p ? p.imageUrl : ''}', ${index}, '${type}')" class="bg-gray-50 hover:bg-gray-100 text-gray-700 p-2 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            <button onclick="removeCartItem(${index}, '${type}')" class="bg-red-50 hover:bg-red-100 text-red-600 p-2 rounded-lg transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
            };

            currentBroilers.forEach((b, i) => {
                list.innerHTML += renderItem(b.description, `${b.qty} Qty`, b.remark, i, 'broiler');
            });
            currentParts.forEach((p, i) => {
                list.innerHTML += renderItem(p.name, `${p.qty} ${p.unit}`, p.remark, i, 'parts');
            });
        }

        window.removeCartItem = (index, type) => {
            if (type === 'broiler') currentBroilers.splice(index, 1);
            else currentParts.splice(index, 1);
            updateCartCount();
            renderCart();
        };

        // Submit Order
        document.getElementById('btn-submit-order').addEventListener('click', async () => {
            const selectedDate = document.getElementById('order-date').value;
            if(!selectedDate) {
                closeModal('modal-cart');
                return showNotify('order-notification', "Delivery Date required.", 'error');
            }

            const generalRemark = document.getElementById('general-remark').value.trim();
            if (currentBroilers.length === 0 && currentParts.length === 0) {
                return alert("Cart is empty.");
            }

            let pendingOrders = [];

            if(currentBroilers.length > 0) {
                pendingOrders.push({
                    customerName: loggedInCustomerName, 
                    customerRemark: generalRemark,
                    productType: 'broiler', 
                    status: 'unapproved', 
                    source: 'b2b_portal',
                    deliveryDate: selectedDate,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    broilers: currentBroilers, 
                    processedText: currentBroilers.map(b => `${b.qty} ${b.description}`).join(', ')
                });
            }

            if(currentParts.length > 0) {
                pendingOrders.push({
                    customerName: loggedInCustomerName, 
                    customerRemark: generalRemark,
                    productType: 'parts', 
                    status: 'unapproved', 
                    source: 'b2b_portal',
                    deliveryDate: selectedDate,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    parts: currentParts, 
                    processedText: `${loggedInCustomerName} Parts Order`
                });
            }

            const btn = document.getElementById('btn-submit-order');
            btn.disabled = true; btn.textContent = "Sending Order...";

            try {
                await Promise.all(pendingOrders.map(o => db.collection('orders').add(o)));
                
                // Clear state
                currentParts = [];
                currentBroilers = [];
                updateCartCount();
                document.getElementById('general-remark').value = '';
                document.getElementById('order-date').value = tomorrowStr;
                
                closeModal('modal-cart');
                showNotify('order-notification', 'Your order was sent successfully!', 'success');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch(error) {
                console.error(error);
                alert("Error saving order.");
            } finally {
                btn.disabled = false; 
                btn.textContent = "Submit Order";
            }
        });
    </script>
</body>
</html>
