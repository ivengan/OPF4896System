<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="clockInPageTitle">Staff Clock-In</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2"/>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://unpkg.com/i18next/i18next.js"></script>
  <script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.js"></script>
  <script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md text-center z-10">
    <h1 class="text-2xl font-bold mb-4" data-i18n="appTitle">Staff Attendance</h1>
    <input
      type="tel"
      id="phone"
      class="w-full px-4 py-2 border rounded-md mb-4 text-center text-lg"
      autocomplete="off"
      inputmode="numeric"
      pattern="[0-9]*"
      data-i18n="[placeholder]"
      data-i18n-key="phonePlaceholder"
    />
    <button
      onclick="handleClockIn()"
      class="bg-blue-500 text-white px-6 py-3 rounded-md hover:bg-blue-600 w-full font-semibold"
      data-i18n="clockInButton"
    >
      Clock In / Clock Out
    </button>
  </div>
  <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80 text-center">
      <h2 class="text-xl font-semibold mb-4">Admin Access</h2>
      <p class="text-gray-600 mb-4">Welcome, Admin. Proceed to the admin panel for more options.</p>
      <button onclick="goToAdminPanel()" class="bg-gray-800 text-white px-4 py-2 rounded-md mb-3 w-full hover:bg-gray-900">Go to Admin Panel</button>
      <button onclick="hideAdminModal()" class="text-sm text-red-500 hover:underline w-full mt-2">Cancel</button>
    </div>
  </div>

  <script src="firebase-init.js"></script>
  <script src="i18n-init.js"></script>
  <script src="app.js"></script>
  <script src="main.js"></script>
  <script>
    const phoneInput = document.getElementById("phone");
    function focusOnFirstInteraction() { phoneInput.focus(); }
    document.addEventListener('touchstart', focusOnFirstInteraction, { once: true });
    document.addEventListener('click', focusOnFirstInteraction, { once: true });
    document.addEventListener("keypress", function (e) {
      if (e.key === "Enter" && document.activeElement === phoneInput) {
        e.preventDefault();
        handleClockIn();
      }
    });
  </script>
</body>
</html>
