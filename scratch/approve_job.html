<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="approveJobTitle">Approve Extra Job</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://unpkg.com/i18next/i18next.js"></script>
  <script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.js"></script>
  <script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.js"></script>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4" data-i18n="approveJobHeader">Extra Job Authentication</h1>
    <p class="text-gray-600 mb-4" data-i18n="approveJobDesc">Enter the 6-digit PIN from the WhatsApp message and your phone number to confirm.</p>
    <form id="approveJobForm" class="space-y-4">
      <div>
        <label for="approvalPin" class="block text-sm font-medium text-gray-700" data-i18n="pinLabel">PIN</label>
        <input id="approvalPin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="mt-1 w-full p-2 border rounded-md" required data-i18n="[placeholder]" data-i18n-key="pinPlaceholder" />
      </div>
      <div>
        <label for="approverPhone" class="block text-sm font-medium text-gray-700" data-i18n="yourPhoneLabel">Your phone number</label>
        <input id="approverPhone" type="tel" class="mt-1 w-full p-2 border rounded-md" required data-i18n="[placeholder]" data-i18n-key="yourPhonePlaceholder" />
      </div>
      <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-md hover:bg-green-700 font-semibold" data-i18n="submitButton">
        Submit
      </button>
    </form>
  </div>

  <script src="firebase-init.js"></script>
  <script src="i18n-init.js"></script>
  <script src="approve_job.js"></script>
  <script src="main.js"></script>
</body>
</html>
