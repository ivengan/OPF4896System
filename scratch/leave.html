<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="leaveAppTitle">Leave Application</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://unpkg.com/i18next/i18next.js"></script>
  <script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.js"></script>
  <script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.js"></script>

  <style>
    input[type="date"] { position: relative; color: #4b5563; }
    input[type="date"]:invalid { color: transparent; }
    input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; right: 0.5rem; }
    input[type="date"]:before { content: attr(placeholder); position: absolute; color: #9ca3af; display: block; }
    input[type="date"]:focus:before,
    input[type="date"]:valid:before { display: none; }
  </style>

</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-lg mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-semibold mb-4" data-i18n="leaveAppHeader">Apply for Leave</h1>
    <form id="leaveForm" class="space-y-4" autocomplete="off">
      <input id="name" type="text" class="w-full p-2 border rounded" required data-i18n="[placeholder]" data-i18n-key="leaveFullNamePlaceholder" />
      <input id="phone" type="tel" class="w-full p-2 border rounded" required autocomplete="off" inputmode="numeric" pattern="[0-9]*" data-i18n="[placeholder]" data-i18n-key="phonePlaceholder" />
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="fromDate" class="block text-sm font-medium text-gray-700">From</label>
          <input id="fromDate" type="date" placeholder="dd-mm-yyyy" class="w-full p-2 border rounded mt-1" required />
        </div>
        <div>
          <label for="toDate" class="block text-sm font-medium text-gray-700">To</label>
          <input id="toDate" type="date" placeholder="dd-mm-yyyy" class="w-full p-2 border rounded mt-1" required />
        </div>
      </div>

      <div>
        <label for="leaveType" class="block text-sm font-medium text-gray-700" data-i18n="leaveTypeLabel">Select Leave Type:</label>
        <select id="leaveType" class="w-full p-2 border rounded mt-1" required>
          <option value="" data-i18n="leaveTypeChoose">-- Choose Leave Type --</option>
          <option value="MC Leave" data-i18n="leaveTypeMC">MC Leave</option>
          <option value="Annual Leave" data-i18n="leaveTypeAnnual">Annual Leave</option>
          <option value="Others" data-i18n="leaveTypeOthers">Others</option>
        </select>
      </div>

      <div id="mcFields" class="hidden space-y-3">
        <input id="mcSerial" type="text" class="w-full p-2 border rounded" data-i18n="[placeholder]" data-i18n-key="mcSerialPlaceholder" />
        <input id="medicalInstitution" type="text" class="w-full p-2 border rounded" data-i18n="[placeholder]" data-i18n-key="clinicPlaceholder" />
      </div>

      <div id="reasonField" class="hidden">
        <textarea id="reason" class="w-full p-2 border rounded" data-i18n="[placeholder]" data-i18n-key="reasonPlaceholder"></textarea>
      </div>

      <div id="otherTypesField" class="hidden space-y-2 border p-3 rounded">
          <label class="block text-sm font-medium text-gray-700">Specify Other Leave:</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Emergency Leave" class="mr-2">Emergency Leave</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Maternity Leave" class="mr-2">Maternity Leave</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Paternity Leave" class="mr-2">Paternity Leave</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Hospitalization" class="mr-2">Hospitalization</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Compassionate Leave" class="mr-2">Compassionate Leave</label>
          <label class="flex items-center"><input type="radio" name="otherLeave" value="Other reason" class="mr-2">Other reason</label>
      </div>

      <button type="submit" class="bg-blue-600 text-white w-full p-3 rounded hover:bg-blue-700 font-semibold" data-i18n="submitLeaveButton">
        Submit Leave Request
      </button>
    </form>
  </div>
  
  <script src="firebase-init.js"></script>
  <script src="i18n-init.js"></script>
  <script src="leave.js"></script>
  <script src="main.js"></script>
</body>
</html>
