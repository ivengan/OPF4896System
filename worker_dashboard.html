<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Worker Dashboard</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7FFFD4">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        /* Landscape enforcement: Show overlay if in portrait */
        @media screen and (orientation: portrait) {
            #portrait-overlay {
                display: flex !important;
            }
        }
        
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #f3f4f6; 
            user-select: none; /* Prevent text selection on long press */
            -webkit-user-select: none;
        }
        
        .sidebar {
            width: 250px;
            background-color: #1f2937;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .content {
            flex-grow: 1;
            height: 100vh;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background-color: #374151;
            color: white;
            text-align: left;
            border-radius: 0.5rem;
            transition: all 0.2s;
            font-weight: bold;
        }

        .menu-btn:hover {
            background-color: #4b5563;
        }

        .menu-btn.active {
            background-color: #3b82f6;
        }
        
        .logout-btn {
            margin-top: auto;
            background-color: #ef4444;
        }
        
        .logout-btn:hover {
            background-color: #dc2626;
        }

        /* Arrange Mode Styles */
        @keyframes shake {
            0% { transform: rotate(-1deg); }
            50% { transform: rotate(1deg); }
            100% { transform: rotate(-1deg); }
        }
        .arrange-mode .menu-btn:not(.logout-btn) {
            animation: shake 0.3s infinite;
            cursor: grab;
            border: 2px dashed #9ca3af;
            opacity: 0.9;
        }
        .arrange-mode .menu-btn:not(.logout-btn):active {
            cursor: grabbing;
        }
        .arrange-mode .logout-btn {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex">

    <!-- Portrait Overlay -->
    <div id="portrait-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex-col items-center justify-center text-white hidden" style="backdrop-filter: blur(10px);">
        <svg class="w-20 h-20 mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        <h2 class="text-2xl font-bold text-center px-4">Please Rotate Your Device</h2>
        <p class="mt-2 text-gray-300 text-center px-4">This dashboard is designed for landscape mode only.</p>
    </div>

    <!-- Sidebar -->
    <div class="sidebar shadow-2xl z-10" id="worker-panel">
        <h2 id="panel-title" class="text-xl font-bold mb-6 text-center text-blue-400 border-b border-gray-600 pb-4 select-none pointer-events-none transition-colors">Worker Panel</h2>
        
        <div id="sortable-menu" class="flex flex-col">
            <button id="btn-order" class="menu-btn active" onclick="loadPage('order.html', this)">Order 下订单</button>
            <button id="btn-do" class="menu-btn" onclick="loadPage('d_o.html', this)">Delivery Order (D/O)</button>
            <button id="btn-broiler-dsptch" class="menu-btn" onclick="loadPage('broiler_dsptch.html', this)">Broiler Dispatch 出鸡</button>
            <button id="btn-parts-dsptch" class="menu-btn" onclick="loadPage('parts_dsptch.html', this)">Parts Dispatch 出冷冻</button>
            <button id="btn-parts-lembik" class="menu-btn" onclick="loadPage('parts_lembik.html', this)">Parts Lembik 出新鲜</button>
            <button id="btn-broiler-rcd" class="menu-btn" onclick="loadPage('broiler_rcd.html', this)">Broiler Record 记录来鸡</button>
            <button id="btn-stock-in" class="menu-btn" onclick="loadPage('stock_in.html', this)">Stock In 记录进货</button>
        </div>

        <button class="menu-btn logout-btn mt-6" onclick="logout()">Logout</button>
    </div>

    <!-- Main Content Area -->
    <div class="content">
        <iframe id="content-frame" src="order.html?mode=worker"></iframe>
    </div>

    <script>
        // Check simple authentication flag
        if (!localStorage.getItem('user_phone')) {
            window.location.href = 'index.html';
        }

        let arrangeMode = false;
        let isLongPress = false;
        let sortableInstance;

        document.addEventListener('DOMContentLoaded', () => {
            loadOrder();
            
            const sortableMenu = document.getElementById('sortable-menu');
            sortableInstance = new Sortable(sortableMenu, {
                animation: 150,
                disabled: true,
                delay: 100, // Helps prevent accidental drags on touch devices
                delayOnTouchOnly: true,
                onEnd: () => {
                    saveOrder();
                }
            });

            // Long press logic
            let pressTimer;
            let startX = 0;
            let startY = 0;
            const workerPanel = document.getElementById('worker-panel');
            
            const startPress = (e) => {
                if(e.target.classList.contains('logout-btn')) return;
                isLongPress = false;
                
                if (e.touches && e.touches.length > 0) {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                } else {
                    startX = e.clientX;
                    startY = e.clientY;
                }

                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    toggleArrangeMode();
                }, 2000); // 2 seconds
            };
            
            const cancelPress = () => {
                clearTimeout(pressTimer);
            };

            const handleMove = (e) => {
                let currentX = 0;
                let currentY = 0;
                if (e.touches && e.touches.length > 0) {
                    currentX = e.touches[0].clientX;
                    currentY = e.touches[0].clientY;
                } else {
                    currentX = e.clientX;
                    currentY = e.clientY;
                }

                // Cancel long press if finger/mouse moves more than 15 pixels
                const distance = Math.sqrt(Math.pow(currentX - startX, 2) + Math.pow(currentY - startY, 2));
                if (distance > 15) {
                    cancelPress();
                }
            };

            workerPanel.addEventListener('touchstart', startPress, {passive: true});
            workerPanel.addEventListener('touchend', cancelPress);
            workerPanel.addEventListener('touchmove', handleMove, {passive: true});
            
            workerPanel.addEventListener('mousedown', startPress);
            workerPanel.addEventListener('mouseup', cancelPress);
            workerPanel.addEventListener('mousemove', handleMove);
            workerPanel.addEventListener('mouseleave', cancelPress);
        });

        function toggleArrangeMode() {
            arrangeMode = !arrangeMode;
            const title = document.getElementById('panel-title');
            
            if (arrangeMode) {
                sortableInstance.option('disabled', false);
                document.body.classList.add('arrange-mode');
                title.innerText = "Arrange Mode (Drag)";
                title.classList.remove('text-blue-400');
                title.classList.add('text-yellow-400');
                if (navigator.vibrate) navigator.vibrate(100);
            } else {
                sortableInstance.option('disabled', true);
                document.body.classList.remove('arrange-mode');
                title.innerText = "Worker Panel";
                title.classList.remove('text-yellow-400');
                title.classList.add('text-blue-400');
                saveOrder();
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }

        function loadOrder() {
            try {
                const savedOrder = JSON.parse(localStorage.getItem('workerMenuOrder'));
                if (savedOrder && Array.isArray(savedOrder) && savedOrder.length > 0) {
                    const container = document.getElementById('sortable-menu');
                    savedOrder.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) container.appendChild(el);
                    });
                }
            } catch(e) {}
        }

        function saveOrder() {
            const container = document.getElementById('sortable-menu');
            const order = Array.from(container.children).map(el => el.id);
            localStorage.setItem('workerMenuOrder', JSON.stringify(order));
        }

        function loadPage(page, btnElement) {
            // Prevent navigation if in arrange mode or just completed a long press
            if (arrangeMode || isLongPress) {
                isLongPress = false;
                return;
            }
            
            // Update iframe source with worker mode parameter
            document.getElementById('content-frame').src = page + '?mode=worker';
            
            // Update active state on buttons
            document.querySelectorAll('.menu-btn:not(.logout-btn)').forEach(btn => {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
        }

        function logout() {
            if (arrangeMode) return;
            localStorage.removeItem('user_phone');
            localStorage.removeItem('loginExpiry');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
