<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="dashboardTitle">Main Menu</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4A90E2"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://unpkg.com/i18next/i18next.js"></script>
  <script src="https://unpkg.com/i18next-http-backend/i18nextHttpBackend.js"></script>
  <script src="https://unpkg.com/i18next-browser-languagedetector/i18nextBrowserLanguageDetector.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <!-- Back Button to Main Dashboard -->
  <div class="absolute top-4 left-4 z-20">
    <button onclick="window.location.href='dashboard.html'" class="text-blue-600 font-bold flex items-center gap-1 bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.25rem; height: 1.25rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Back
    </button>
  </div>

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm text-center">
    <h1 class="text-2xl font-bold mb-6" data-i18n="dashboardTitle">Main Menu</h1>
    <div class="space-y-4">
      <button 
        onclick="window.location.href='attendance.html'"
        class="w-full bg-blue-500 text-white px-6 py-4 rounded-md hover:bg-blue-600 font-semibold text-lg"
        data-i18n="dashboardClockInButton"
      >
        Clock in / Clock out
      </button>
      <button 
        onclick="window.location.href='leave.html'"
        class="w-full bg-green-500 text-white px-6 py-4 rounded-md hover:bg-green-600 font-semibold text-lg"
        data-i18n="dashboardApplyLeaveButton"
      >
        Apply Leave
      </button>
      <button 
        onclick="window.location.href='extra_job.html'"
        class="w-full bg-purple-500 text-white px-6 py-4 rounded-md hover:bg-purple-600 font-semibold text-lg"
        data-i18n="dashboardApplyExtraJobButton"
      >
        Apply Extra Jobs
      </button>
    </div>
  </div>

  <script src="firebase-init-attendance.js"></script>
  <script src="i18n-init.js"></script>
  <script src="main.js"></script>
</body>
</html>
