  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    .job-btn.bg-blue-500 { color: white; }
  </style>
</head>
<body class="bg-gray-100 p-6">
  <!-- Back Button to Staff Portal -->
  <div class="max-w-lg mx-auto mb-4">
    <button onclick="window.location.href='attendance_dashboard.html'" class="text-blue-600 font-bold flex items-center gap-1 bg-white px-3 py-2 rounded-lg shadow-sm border border-gray-200">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.25rem; height: 1.25rem;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      Back to Portal
    </button>
  </div>

  <div class="max-w-lg mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4" data-i18n="extraJobTitle">Extra Job Request</h1>
    <p class="text-gray-600 mb-4" data-i18n="extraJobDesc">First, select the job type. Then, specify the initiator and approver.</p>
    
    <form id="extraJobForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="jobDetailsLabel">Job Details</label>
        <div id="job-options" class="grid grid-cols-2 gap-3">
          <button type="button" id="btnPullCages" class="job-btn flex items-center justify-center p-3 border-2 border-gray-300 rounded-md text-gray-700 hover:border-blue-500 hover:bg-blue-50 transition"><span class="icon icon-baggage"></span><span data-i18n="jobPullCages">Pull cages</span></button>
          <button type="button" id="btnFollowLorry" class="job-btn flex items-center justify-center p-3 border-2 border-gray-300 rounded-md text-gray-700 hover:border-blue-500 hover:bg-blue-50 transition"><span class="icon icon-truck"></span><span data-i18n="jobFollowLorry">Follow lorry</span></button>
          <button type="button" id="btnDisinfect" class="job-btn flex items-center justify-center p-3 border-2 border-gray-300 rounded-md text-gray-700 hover:border-blue-500 hover:bg-blue-50 transition"><span class="icon icon-cross"></span><span data-i18n="jobDisinfect">Disinfect</span></button>
          <button type="button" id="btnOthers" class="job-btn flex items-center justify-center p-3 border-2 border-gray-300 rounded-md text-gray-700 hover:border-blue-500 hover:bg-blue-50 transition"><span class="icon icon-clipboardplus"></span><span class="btn-text" data-i18n="jobOther">Other jobs</span></button>
        </div>
      </div>
      <div>
        <label for="initiatorPhone" class="block text-sm font-medium text-gray-700" data-i18n="initiatorPhoneLabel">Your Phone Number (Initiator)</label>
        <input id="initiatorPhone" type="tel" class="mt-1 w-full p-2 border rounded-md" required data-i18n="[placeholder]" data-i18n-key="phonePlaceholder" />
      </div>
      <div>
        <label for="approverPhone" class="block text-sm font-medium text-gray-700" data-i18n="approverPhoneLabel">Approver's Phone Number</label>
        <input id="approverPhone" type="tel" class="mt-1 w-full p-2 border rounded-md" required data-i18n="[placeholder]" data-i18n-key="approverPhonePlaceholder" />
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-md hover:bg-blue-700 font-semibold" data-i18n="generatePinButton">
        Generate PIN and submit
      </button>
    </form>
  </div>
  
  <script src="firebase-init-attendance.js"></script>
  <script src="i18n-init.js"></script>
  <script src="extra_job.js"></script>
  <script src="main.js"></script>
</body>
</html>
